name: Build and publish GPU inference image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'inference/**'
      - '.github/workflows/publish.yaml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Offline tests for gateway and model bootstrap
        run: |
          node --test inference/test-ensure-models.cjs inference/gateway/test-gateway.cjs
          node inference/ensure-models.cjs --dry-run
          sh -n inference/start-dual-model.sh

      - name: Validate required credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN"; exit 1; }
          test "$DOCKERHUB_USERNAME" = "faithfultennysonw" || { echo "Unexpected Docker Hub account"; exit 1; }

      - name: Free disk space for CUDA image
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost
          docker system prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and load NEW inference image for pre-push verification
        uses: docker/build-push-action@v6
        with:
          context: ./inference
          file: ./inference/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: faithfultennysonw/qwen-dual-inference:v3
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Check CUDA image and router CLI before publishing
        run: |
          docker image inspect faithfultennysonw/qwen-dual-inference:v3 --format '{{.Id}}'
          docker run --rm --entrypoint /bin/sh faithfultennysonw/qwen-dual-inference:v3 -c 'node --version && /usr/local/bin/cloudflared --version && test -x /app/llama-server'
          docker run --rm --entrypoint /app/llama-server faithfultennysonw/qwen-dual-inference:v3 --help > /tmp/llama-help.txt
          grep -F -- '--models-preset' /tmp/llama-help.txt
          grep -F -- '--models-max' /tmp/llama-help.txt
          grep -F -- '--models-autoload' /tmp/llama-help.txt
          grep -F -- '--mmproj' /tmp/llama-help.txt

      - name: Publish only tested image to new Docker Hub repository
        run: docker push faithfultennysonw/qwen-dual-inference:v3
