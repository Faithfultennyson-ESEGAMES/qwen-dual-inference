# Reference preset for human review. Runtime writes only verified models into
# /workspace/config/active-models.ini so newly downloaded models can be
# discovered without restarting the Pod. One model loaded in GPU at a time.
version = 1

[*]
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
parallel = 1
no-context-shift = true
load-on-startup = false

[qwen3.8-27b-uncensored]
model = /workspace/models/qwen3.8-27b-uncensored/Qwen3.8-27B-Uncensored-Q4_K_M.gguf
mmproj = /workspace/models/qwen3.8-27b-uncensored/mmproj-Qwen3.8-27B-Uncensored-F16.gguf
ctx-size = 167936
n-predict = 30000

[qwen3.6-35b-a3b]
model = /workspace/models/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-Q4_K_M.gguf
mmproj = /workspace/models/qwen3.6-35b-a3b/mmproj-Qwen3.6-35B-A3B-Q8_0.gguf
ctx-size = 167936
n-predict = 30000

[qwen3-coder-next]
model = /workspace/models/qwen3-coder-next/Qwen3-Coder-Next-Q5_K_M/Qwen3-Coder-Next-Q5_K_M-00001-of-00004.gguf
ctx-size = 167936
n-predict = 30000
